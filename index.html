<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocal & Instrumental Remover | Studio Spatial Mixer</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12141c;
      --card-inner: #191c28;
      --border: #232838;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .studio { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 660px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 20px; }
    .title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .badge { background: #1e2433; color: #93c5fd; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: 1px solid #2b354d; font-weight: 500; }
    
    .dropzone { border: 2px dashed var(--border); border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.01); }
    .dropzone:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.08); }
    .dropzone p { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

    .progress-box { margin: 18px 0; display: none; }
    .progress-bar-bg { width: 100%; height: 6px; background: #1e2433; border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
    .status-text { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 6px; }

    .workspace { display: none; margin-top: 18px; }
    
    .quick-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .mode-btn { background: #1a1e2d; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .mode-btn:hover { border-color: var(--accent); }
    .mode-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .track-card { background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .track-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .track-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
    .control-group label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
    select, input[type=range] { width: 100%; accent-color: var(--accent); }
    select { background: #10121a; border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 0.8rem; outline: none; }

    .transport-bar { display: flex; gap: 10px; margin-top: 18px; }
    button { cursor: pointer; font-size: 0.85rem; font-weight: 600; border-radius: 6px; padding: 10px 14px; border: none; transition: 0.15s; }
    .btn-primary { background: var(--accent); color: white; flex: 1; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #1e2433; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #2a3449; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; border-radius: 4px; }
    .btn-mute { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-mute.muted { background: var(--danger); border-color: var(--danger); color: white; }
  </style>
</head>
<body>

<div class="studio">
  <div class="header">
    <div class="title">Vocal & Instrumental Studio</div>
    <div class="badge">3GB RAM Optimized &bull; 100% Offline</div>
  </div>

  <div class="dropzone" id="dropzone" onclick="document.getElementById('audioInput').click()">
    <strong>Drop audio file here or click to browse</strong>
    <p>Supports MP3, WAV, FLAC, AAC. Processed in memory-safe chunks.</p>
    <input type="file" id="audioInput" accept="audio/*" style="display: none;">
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div class="status-text" id="statusText">0%</div>
  </div>

  <div class="workspace" id="workspace">
    <!-- Preset Mode Selectors -->
    <div class="quick-modes">
      <button class="mode-btn active" id="modeBalanced" onclick="setPreset('balanced')">Original Balance</button>
      <button class="mode-btn" id="modeKaraoke" onclick="setPreset('karaoke')">Remove Vocals (Karaoke)</button>
      <button class="mode-btn" id="modeAcapella" onclick="setPreset('acapella')">Remove Music (Acapella)</button>
    </div>

    <!-- VOCALS SECTION -->
    <div class="track-card">
      <div class="track-top">
        <span class="track-title">🎤 Vocals</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn-sm btn-mute" id="muteVocalsBtn" onclick="toggleMute('vocals')">Mute</button>
          <button class="btn-sm btn-secondary" onclick="exportStemWav('vocals')">Export Vocals WAV</button>
        </div>
      </div>
      <div class="controls-grid">
        <div class="control-group">
          <label>Film Motion & Stereo Travel</label>
          <select id="vocalPanMode" onchange="updateAutomation()">
            <option value="center">Center (Standard)</option>
            <option value="panL">Hard Left</option>
            <option value="panR">Hard Right</option>
            <option value="l_to_r">Cinematic Pan: Left &rarr; Right</option>
            <option value="r_to_l">Cinematic Pan: Right &rarr; Left</option>
            <option value="orbit">Continuous Orbit (Left &harr; Right)</option>
          </select>
        </div>
        <div class="control-group">
          <label>Volume Level</label>
          <input type="range" id="vocalVol" min="0" max="1.5" step="0.05" value="1" oninput="updateVolumes()">
        </div>
      </div>
    </div>

    <!-- INSTRUMENTAL SECTION -->
    <div class="track-card">
      <div class="track-top">
        <span class="track-title">🎸 Instrumental / Music</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn-sm btn-mute" id="muteMusicBtn" onclick="toggleMute('music')">Mute</button>
          <button class="btn-sm btn-secondary" onclick="exportStemWav('music')">Export Music WAV</button>
        </div>
      </div>
      <div class="controls-grid">
        <div class="control-group">
          <label>Film Motion & Stereo Travel</label>
          <select id="musicPanMode" onchange="updateAutomation()">
            <option value="center">Center (Standard)</option>
            <option value="panL">Hard Left</option>
            <option value="panR">Hard Right</option>
            <option value="l_to_r">Cinematic Pan: Left &rarr; Right</option>
            <option value="r_to_l">Cinematic Pan: Right &rarr; Left</option>
            <option value="orbit">Continuous Orbit (Left &harr; Right)</option>
          </select>
        </div>
        <div class="control-group">
          <label>Volume Level</label>
          <input type="range" id="musicVol" min="0" max="1.5" step="0.05" value="1" oninput="updateVolumes()">
        </div>
      </div>
    </div>

    <div class="transport-bar">
      <button class="btn-primary" id="playBtn" onclick="togglePlayback()">Play Mix</button>
      <button class="btn-secondary" onclick="exportMasterMix()">Export Master Mix (.WAV)</button>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  let rawBuffer = null;
  let stems = { vocals: null, music: null };
  let nodes = { vSrc: null, mSrc: null, vPan: null, mPan: null, vGain: null, mGain: null };
  let isPlaying = false;
  let muteState = { vocals: false, music: false };

  // 4-second blocks: Keeps buffer consumption well inside 300MB working RAM
  const CHUNK_SIZE = 44100 * 4;

  document.getElementById('audioInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('dropzone').style.display = 'none';
    const progressBox = document.getElementById('progressBox');
    const statusText = document.getElementById('statusText');
    progressBox.style.display = 'block';

    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    
    statusText.innerText = "Loading audio into memory...";
    const arrayBuffer = await file.arrayBuffer();
    rawBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    runSeparationPipeline();
  });

  // RAM-safe Mid/Side phase cancellation extraction
  function runSeparationPipeline() {
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('statusText');
    const totalSamples = rawBuffer.length;
    const sampleRate = rawBuffer.sampleRate;

    // Allocate stereo buffers
    stems.vocals = audioCtx.createBuffer(2, totalSamples, sampleRate);
    stems.music = audioCtx.createBuffer(2, totalSamples, sampleRate);

    const left = rawBuffer.getChannelData(0);
    const right = rawBuffer.numberOfChannels > 1 ? rawBuffer.getChannelData(1) : left;

    const vL = stems.vocals.getChannelData(0);
    const vR = stems.vocals.getChannelData(1);
    const mL = stems.music.getChannelData(0);
    const mR = stems.music.getChannelData(1);

    let cursor = 0;

    function processSlice() {
      if (cursor >= totalSamples) {
        bar.style.width = '100%';
        status.innerText = "Processing Complete.";
        setTimeout(() => {
          document.getElementById('progressBox').style.display = 'none';
          document.getElementById('workspace').style.display = 'block';
        }, 400);
        return;
      }

      const limit = Math.min(cursor + CHUNK_SIZE, totalSamples);

      for (let i = cursor; i < limit; i++) {
        const mid = (left[i] + right[i]) * 0.5;   // Phantom center (Lead vocals)
        const side = (left[i] - right[i]) * 0.5;  // Stereo side information (Instruments, wide mix)

        // Vocal Isolation: Isolates center-panned speech/singing frequencies
        vL[i] = mid;
        vR[i] = mid;

        // Instrumental Isolation: Cancels identical phantom-center vocals out of stereo field
        mL[i] = left[i] - mid;
        mR[i] = right[i] - mid;
      }

      cursor = limit;
      const pct = Math.round((cursor / totalSamples) * 100);
      bar.style.width = pct + '%';
      status.innerText = `Extracting stems (RAM-safe): ${pct}%`;

      setTimeout(processSlice, 4);
    }

    processSlice();
  }

  // Preset Mode Switcher (Karaoke / Acapella / Original)
  function setPreset(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));

    const vVol = document.getElementById('vocalVol');
    const mVol = document.getElementById('musicVol');

    if (mode === 'karaoke') {
      document.getElementById('modeKaraoke').classList.add('active');
      vVol.value = 0;
      mVol.value = 1;
    } else if (mode === 'acapella') {
      document.getElementById('modeAcapella').classList.add('active');
      vVol.value = 1;
      mVol.value = 0;
    } else {
      document.getElementById('modeBalanced').classList.add('active');
      vVol.value = 1;
      mVol.value = 1;
    }
    updateVolumes();
  }

  function toggleMute(type) {
    muteState[type] = !muteState[type];
    const btn = document.getElementById(type === 'vocals' ? 'muteVocalsBtn' : 'muteMusicBtn');
    btn.classList.toggle('muted', muteState[type]);
    btn.innerText = muteState[type] ? 'Muted' : 'Mute';
    updateVolumes();
  }

  function setupAudioNodes() {
    if (nodes.vSrc) {
      try { nodes.vSrc.stop(); nodes.mSrc.stop(); } catch(e){}
    }

    nodes.vSrc = audioCtx.createBufferSource();
    nodes.mSrc = audioCtx.createBufferSource();
    nodes.vSrc.buffer = stems.vocals;
    nodes.mSrc.buffer = stems.music;

    nodes.vPan = audioCtx.createStereoPanner();
    nodes.mPan = audioCtx.createStereoPanner();

    nodes.vGain = audioCtx.createGain();
    nodes.mGain = audioCtx.createGain();

    nodes.vSrc.connect(nodes.vPan);
    nodes.vPan.connect(nodes.vGain);
    nodes.vGain.connect(audioCtx.destination);

    nodes.mSrc.connect(nodes.mPan);
    nodes.mPan.connect(nodes.mGain);
    nodes.mGain.connect(audioCtx.destination);

    updateVolumes();
    updateAutomation();
  }

  function updateVolumes() {
    if (!nodes.vGain) return;
    const vVal = muteState.vocals ? 0 : parseFloat(document.getElementById('vocalVol').value);
    const mVal = muteState.music ? 0 : parseFloat(document.getElementById('musicVol').value);
    nodes.vGain.gain.setValueAtTime(vVal, audioCtx.currentTime);
    nodes.mGain.gain.setValueAtTime(mVal, audioCtx.currentTime);
  }

  function schedulePan(param, mode, dur) {
    const t = audioCtx.currentTime;
    param.cancelScheduledValues(t);

    if (mode === 'center') param.setValueAtTime(0, t);
    else if (mode === 'panL') param.setValueAtTime(-1, t);
    else if (mode === 'panR') param.setValueAtTime(1, t);
    else if (mode === 'l_to_r') {
      param.setValueAtTime(-1, t);
      param.linearRampToValueAtTime(1, t + dur);
    } else if (mode === 'r_to_l') {
      param.setValueAtTime(1, t);
      param.linearRampToValueAtTime(-1, t + dur);
    } else if (mode === 'orbit') {
      const step = 8;
      for (let s = 0; s < dur; s += step) {
        param.setValueAtTime(0, t + s);
        param.linearRampToValueAtTime(1, t + s + step * 0.25);
        param.linearRampToValueAtTime(0, t + s + step * 0.5);
        param.linearRampToValueAtTime(-1, t + s + step * 0.75);
        param.linearRampToValueAtTime(0, t + s + step);
      }
    }
  }

  function updateAutomation() {
    if (!isPlaying) return;
    const dur = stems.vocals.duration;
    schedulePan(nodes.vPan.pan, document.getElementById('vocalPanMode').value, dur);
    schedulePan(nodes.mPan.pan, document.getElementById('musicPanMode').value, dur);
  }

  function togglePlayback() {
    if (isPlaying) {
      nodes.vSrc.stop();
      nodes.mSrc.stop();
      isPlaying = false;
      document.getElementById('playBtn').innerText = "Play Mix";
    } else {
      setupAudioNodes();
      nodes.vSrc.start(0);
      nodes.mSrc.start(0);
      isPlaying = true;
      document.getElementById('playBtn').innerText = "Stop";
    }
  }

  // 16-Bit PCM WAV Binary Builder
  function bufferToWav(buf) {
    const numChannels = buf.numberOfChannels;
    const sampleRate = buf.sampleRate;
    const left = buf.getChannelData(0);
    const right = numChannels > 1 ? buf.getChannelData(1) : left;
    const byteLength = left.length * numChannels * 2;
    
    const arrayBuf = new ArrayBuffer(44 + byteLength);
    const view = new DataView(arrayBuf);

    function writeStr(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + byteLength, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * 2, true);
    view.setUint16(32, numChannels * 2, true);
    view.setUint16(34, 16, true); // 16-bit
    writeStr(36, 'data');
    view.setUint32(40, byteLength, true);

    let offset = 44;
    for (let i = 0; i < left.length; i++) {
      let l = Math.max(-1, Math.min(1, left[i]));
      view.setInt16(offset, l < 0 ? l * 0x8000 : l * 0x7FFF, true);
      offset += 2;
      let r = Math.max(-1, Math.min(1, right[i]));
      view.setInt16(offset, r < 0 ? r * 0x8000 : r * 0x7FFF, true);
      offset += 2;
    }
    return new Blob([view], { type: 'audio/wav' });
  }

  function downloadFile(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportStemWav(stem) {
    const blob = bufferToWav(stems[stem]);
    downloadFile(blob, stem === 'vocals' ? 'clean_vocals.wav' : 'clean_instrumental.wav');
  }

  async function exportMasterMix() {
    const dur = stems.vocals.duration;
    const offCtx = new OfflineAudioContext(2, dur * 44100, 44100);

    const vS = offCtx.createBufferSource();
    const mS = offCtx.createBufferSource();
    vS.buffer = stems.vocals;
    mS.buffer = stems.music;

    const vP = offCtx.createStereoPanner();
    const mP = offCtx.createStereoPanner();
    const vG = offCtx.createGain();
    const mG = offCtx.createGain();

    vG.gain.value = muteState.vocals ? 0 : parseFloat(document.getElementById('vocalVol').value);
    mG.gain.value = muteState.music ? 0 : parseFloat(document.getElementById('musicVol').value);

    schedulePan(vP.pan, document.getElementById('vocalPanMode').value, dur);
    schedulePan(mP.pan, document.getElementById('musicPanMode').value, dur);

    vS.connect(vP); vP.connect(vG); vG.connect(offCtx.destination);
    mS.connect(mP); mP.connect(mG); mG.connect(offCtx.destination);

    vS.start(0);
    mS.start(0);

    const rendered = await offCtx.startRendering();
    downloadFile(bufferToWav(rendered), 'mastered_motion_mix.wav');
  }
</script>
</body>
</html>
